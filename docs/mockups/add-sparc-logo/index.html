<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sparc logo concepts</title>
<style>
  :root {
    --purple: #552583;      /* Lakers purple */
    --purple-dark-ui: #b08be0; /* lighter purple for dark backgrounds */
    --gold: #fdb927;        /* Lakers gold, optional spark accent */
    --spark: var(--purple);
    --spark-dark-ui: var(--purple-dark-ui);
    --ink: #1f2328;
    --muted: #59636e;
    --line: #d1d9e0;
    --bg: #ffffff;
    --gh-dark: #0d1117;
  }
  body.gold { --spark: var(--gold); --spark-dark-ui: var(--gold); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }
  label.toggle { display: inline-flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  label.toggle:focus-within { outline: 2px solid var(--purple); outline-offset: 2px; }
  section.concept { border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin-top: 24px; }
  section.concept h2 { font-size: 1.125rem; margin: 0 0 4px; }
  section.concept p { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .tile { border-radius: 8px; padding: 20px; display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 120px; }
  .light { background: #fff; border: 1px solid var(--line); color: var(--purple); --s: var(--spark); }
  .dark { background: var(--gh-dark); color: var(--purple-dark-ui); --s: var(--spark-dark-ui); }
  .sizes { justify-content: space-around; }
  .wordmark { font-weight: 650; font-size: 40px; letter-spacing: -0.02em; line-height: 1; }
  .icon { width: 128px; height: 128px; border-radius: 28px; background: var(--purple); color: #fff; display: grid; place-items: center; --s: var(--spark-on-tile, #fff); }
  body.gold .icon { --s: var(--gold); }
  .caption { font-size: 0.8125rem; color: var(--muted); text-align: center; margin-top: 6px; }
  svg { display: block; }
  @media (max-width: 480px) { .wordmark { font-size: 32px; } }
</style>
</head>
<body>
<main>
  <h1>sparc logo concepts</h1>
  <p class="lead">Each concept is a symbol and the word "sparc". The symbol alone is the plugin icon. Color: Lakers purple #552583, and a lighter purple on dark backgrounds.</p>
  <label class="toggle"><input type="checkbox" id="gold"> Show the spark in Lakers gold (#fdb927)</label>

  <!-- Symbol definitions: stroke and text use currentColor, the spark uses var(--s). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <path id="spark" d="M0,-10 C1.2,-2.4 2.4,-1.2 10,0 C2.4,1.2 1.2,2.4 0,10 C-1.2,2.4 -2.4,1.2 -10,0 C-2.4,-1.2 -1.2,-2.4 0,-10 Z"/>
      <!-- A: spark breaks out of a container box -->
      <mask id="cutA"><rect width="64" height="64" fill="#fff"/><circle cx="46" cy="18" r="14" fill="#000"/></mask>
      <g id="symA">
        <rect x="8" y="16" width="40" height="40" rx="7" fill="none" stroke="currentColor" stroke-width="5" mask="url(#cutA)"/>
        <use href="#spark" transform="translate(46 18) scale(1.15)" fill="var(--s)"/>
      </g>
      <!-- B: an arc over spec brackets, with the spark inside -->
      <g id="symB" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 22 Q32 2 54 22"/>
        <path d="M21 28 H13 V56 H21"/>
        <path d="M43 28 H51 V56 H43"/>
        <use href="#spark" transform="translate(32 42) scale(0.95)" fill="var(--s)" stroke="none"/>
      </g>
      <!-- C: two connected building blocks, the spark on the relation -->
      <g id="symC" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round">
        <rect x="6" y="34" width="20" height="20" rx="4"/>
        <rect x="38" y="10" width="20" height="20" rx="4"/>
        <path d="M26 40 L38 24" stroke-linecap="round"/>
        <use href="#spark" transform="translate(32 32) scale(0.9)" fill="var(--s)" stroke="none"/>
      </g>
    </defs>
  </svg>

  <template id="concept">
    <section class="concept">
      <h2></h2>
      <p></p>
      <div class="row">
        <div class="tile light sizes" data-sizes></div>
        <div class="tile light" data-lockup></div>
        <div class="tile dark" data-lockup></div>
        <div><div class="tile" style="padding:0"><div class="icon" data-icon></div></div><div class="caption">Plugin icon (512 px PNG)</div></div>
      </div>
    </section>
  </template>
</main>
<script>
  const concepts = [
    ['A', 'Spark out of the box', 'A C4 container box. The spark of an idea breaks out at the top right corner. Simple, reads well at 16 px.'],
    ['B', 'Arc over the spec', 'An arc (architecture) over square brackets (specs). The spark sits inside. It also reads as "[spark]" under a roof.'],
    ['C', 'Connected blocks', 'Two building blocks with a relation, as in a C4 container diagram. The spark sits on the relation.'],
  ];
  const sym = (id, size, label) => `<svg width="${size}" height="${size}" viewBox="0 0 64 64" role="img" aria-label="${label}"><use href="#sym${id}"/></svg>`;
  const main = document.querySelector('main');
  const tpl = document.getElementById('concept');
  for (const [id, title, text] of concepts) {
    const node = tpl.content.cloneNode(true);
    node.querySelector('h2').textContent = `${id}: ${title}`;
    node.querySelector('p').textContent = text;
    node.querySelector('[data-sizes]').innerHTML = [128, 64, 32, 16].map((s) => sym(id, s, `sparc symbol ${id}, ${s} px`)).join('');
    for (const el of node.querySelectorAll('[data-lockup]')) el.innerHTML = `${sym(id, 48, `sparc symbol ${id}`)}<span class="wordmark">sparc</span>`;
    node.querySelector('[data-icon]').innerHTML = sym(id, 88, `sparc plugin icon ${id}`);
    main.appendChild(node);
  }
  document.getElementById('gold').addEventListener('change', (e) => document.body.classList.toggle('gold', e.target.checked));
</script>
</body>
</html>
