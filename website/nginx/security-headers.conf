# Included by the server and by each location that sets its own headers: nginx drops inherited
# add_header directives in a block that has one of its own. Matomo: script from cdn.matomo.cloud, tracking requests to
# vensas.matomo.cloud, only after consent (see website/assets/site.js).
add_header Content-Security-Policy "default-src 'none'; img-src 'self' https://vensas.matomo.cloud; font-src 'self'; style-src 'self'; script-src 'self' https://cdn.matomo.cloud; connect-src https://vensas.matomo.cloud; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
