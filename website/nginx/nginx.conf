include /etc/nginx/modules/*.conf;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # The access log has no IP address of the visitor (spec "Access log without IP address").
    log_format noip '$time_iso8601 "$request" $status $body_bytes_sent';
    access_log /dev/stdout noip;
    sendfile on;
    tcp_nopush on;

    # No version and, with headers-more, no Server header at all.
    server_tokens off;
    more_clear_headers Server;

    # Small limits: the site only serves static files.
    client_max_body_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # Writable paths for an unprivileged nginx.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # Rendered at start by docker-entrypoint.sh. /etc/nginx stays read-only for the nginx user.
    include /tmp/site.conf;
}
