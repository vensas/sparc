name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Verify the release
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  # The website shows the release: test and deploy it after the release is verified and created.
  website:
    needs: publish
    if: ${{ !github.event.act }}
    uses: ./.github/workflows/website.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
